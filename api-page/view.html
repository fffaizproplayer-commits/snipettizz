<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>snip.izzcs — snippet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
<style>
  .snip-badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 800;
    border: 1.5px solid var(--ink); border-radius: 999px; padding: 3px 10px; margin-bottom: 10px;
    background: var(--mint); color: #063D2C;
  }
  .snip-badge.feature { background: var(--yellow); color: #141414; }

  .detail-head { border: var(--border-w) solid var(--ink); border-radius: var(--radius); background: var(--card); padding: 18px; margin-bottom: 14px; }
  .detail-title { font-size: 19px; font-weight: 800; margin: 0 0 8px; line-height: 1.3; }
  .detail-date {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-soft);
    border: 1.5px solid var(--ink); border-radius: 999px; padding: 4px 12px;
  }

  .action-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .action-row .btn { width: 100%; font-size: 13px; padding: 12px; }

  .term { border: var(--border-w) solid var(--ink); border-radius: var(--radius); overflow: hidden; }
  .term-head { background: var(--mint); color: #063D2C; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: var(--border-w) solid var(--ink); }
  .dots { display: flex; gap: 5px; }
  .dots span { width: 9px; height: 9px; border-radius: 50%; display: block; }
  .dots span:nth-child(1) { background: #E5484D; }
  .dots span:nth-child(2) { background: #FFB020; }
  .dots span:nth-child(3) { background: #1F8C67; }
  .term-tag { font-size: 10px; font-weight: 800; border: 1.5px solid #063D2C; border-radius: 999px; padding: 2px 10px; }
  .term-body { background: #0F0F0F; overflow-x: auto; }
  .term-body pre { margin: 0; padding: 14px; font-size: 12px; line-height: 1.6; }
  .term-body code { font-family: 'JetBrains Mono', monospace !important; }

  .loading-msg, .error-msg { text-align: center; font-size: 12px; color: var(--ink-soft); padding: 30px 0; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; font-size: 12px; font-weight: 700;
    padding: 10px 16px; border-radius: 999px; z-index: 300; opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">

  <div id="nav-root"></div>

  <div id="content">
    <p class="loading-msg">loading snippet...</p>
  </div>

</div>

<div class="toast" id="toast">Copied!</div>

<script src="/nav.js"></script>
<script>
  initNav('snippet');

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1400);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  }

  function fmtDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('id-ID', { year: 'numeric', month: 'numeric', day: 'numeric' }) +
      ', ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  const id = decodeURIComponent(window.location.pathname.split('/').filter(Boolean).pop());

  async function loadSnippet() {
    const content = document.getElementById('content');
    try {
      const res = await fetch(`/api/snippets/${id}`);
      if (!res.ok) throw new Error('not found');
      const { result: s } = await res.json();

      content.innerHTML = `
        <span class="snip-badge ${s.category.toLowerCase()}"><svg class="icon-sm"><use href="#icon-search"></use></svg> ${s.category.toUpperCase()}</span>

        <div class="detail-head">
          <p class="detail-title">${s.title}</p>
          <span class="detail-date"><svg class="icon-sm"><use href="#icon-calendar"></use></svg> ${fmtDate(s.date)}</span>
        </div>

        <div class="action-row">
          <button class="btn btn-mint" id="copyBtn" type="button"><svg class="icon-sm"><use href="#icon-copy"></use></svg> Copy</button>
          <button class="btn btn-yellow" id="shareBtn" type="button"><svg class="icon-sm"><use href="#icon-share"></use></svg> Share</button>
          <a class="btn btn-card" id="rawBtn" href="/api/snippets/${s.id}/raw" target="_blank" rel="noopener"><svg class="icon-sm"><use href="#icon-file"></use></svg> Raw</a>
          <button class="btn btn-card" id="deleteBtn" type="button" style="color:#C0392B;"><svg class="icon-sm"><use href="#icon-close"></use></svg> Delete</button>
          <a class="btn btn-card" href="/"><svg class="icon-sm"><use href="#icon-arrow-right" style="transform:rotate(180deg)"></use></svg> Back</a>
        </div>

        <div class="term">
          <div class="term-head">
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="dots"><span></span><span></span><span></span></span>
              <span style="font-size:12px;font-weight:700;">${s.file}</span>
            </div>
            <span class="term-tag">${s.category.toUpperCase()}</span>
          </div>
          <div class="term-body">
            <pre><code class="language-javascript" id="codeBlock">${escapeHtml(s.code)}</code></pre>
          </div>
        </div>
      `;

      if (window.hljs) hljs.highlightElement(document.getElementById('codeBlock'));

      document.getElementById('copyBtn').addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(s.code); showToast('Code copied!'); }
        catch (e) { showToast('Copy failed'); }
      });

      document.getElementById('shareBtn').addEventListener('click', async () => {
        const url = window.location.href;
        try {
          if (navigator.share) await navigator.share({ title: s.title, url });
          else { await navigator.clipboard.writeText(url); showToast('Link copied!'); }
        } catch (e) { /* cancelled */ }
      });

      document.getElementById('deleteBtn').addEventListener('click', async () => {
        if (!confirm(`Hapus snippet "${s.title}"? Ini gak bisa dibatalin.`)) return;
        try {
          const res = await fetch(`/api/snippets/${s.id}`, { method: 'DELETE' });
          const data = await res.json();
          if (!data.status) throw new Error(data.message || 'Gagal menghapus snippet');
          window.location.href = '/';
        } catch (e) {
          showToast(e.message || 'Gagal menghapus');
        }
      });

    } catch (e) {
      content.innerHTML = `
        <div class="error-msg">
          Snippet not found.<br><br>
          <a class="btn btn-ink" href="/">&larr; Back to Snippet Library</a>
        </div>
      `;
    }
  }

  loadSnippet();
</script>
</body>
</html>
